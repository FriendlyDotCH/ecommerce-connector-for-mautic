mautic.plugin.ecommerce.gdpr_warning_title="Personal data stored by this plugin"
mautic.plugin.ecommerce.gdpr_warning="This integration stores order and revenue data linked to contacts, which may be personal data under GDPR and similar privacy laws. Page-hit tracking uses Mautic visitor identification cookies and does not set an additional cookie. It may send a contact email to link an existing contact, and orders from those tracking requests can be stored even when Mautic does not save a page hit, including when the browser sends DNT or GPC. You are solely responsible for any data protection measures required for your use of this integration, including lawful basis, privacy policy disclosures, and consent where required."
mautic.plugin.ecommerce.gdpr_data_intro="When orders are tracked, Mautic may store and display:"
mautic.plugin.ecommerce.gdpr_data_orders="Order identifiers, totals, currency, source, location, and order date"
mautic.plugin.ecommerce.gdpr_data_items="Line items (product or item ID, name, quantity, and category), when provided"
mautic.plugin.ecommerce.gdpr_data_email="Optional contact email from page hits or the webhook, used only to link an existing Mautic contact (contacts are never created from these requests)"
mautic.plugin.ecommerce.gdpr_data_attribution="Links between orders and contacts, and optional attribution to Mautic emails"
mautic.plugin.ecommerce.gdpr_data_fields="Contact commerce fields (lifetime value, order count, last order date, and last order total)"
mautic.plugin.ecommerce.gdpr_data_timeline="Contact timeline entries and report data derived from those orders"
mautic.plugin.ecommerce.gdpr_erasure="Deleting a contact also deletes that contact's ecommerce orders and line items."
mautic.plugin.ecommerce.gdpr_export="Contact export includes order history so you can fulfill access requests."
mautic.plugin.ecommerce.webhook_privacy_notice="The signed webhook is server-to-server and does not set cookies, but it still processes personal data. Update your privacy policy and confirm you have a lawful basis before sending order information to Mautic."
