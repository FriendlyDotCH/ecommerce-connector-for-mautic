mautic.plugin.ecommerce.install.script_heading="Browser-Tracking (Skript)"
mautic.plugin.ecommerce.install.script_intro="Aktivieren Sie im Tab Allgemein <strong>Bestellungen aus Seitenaufrufen erfassen</strong> und senden Sie anschließend die Bestelldaten von Ihrer Danke-Seite über das Mautic-Tracking (<code>mtc.js</code>). Bestellungen werden erfasst, wenn <code>mt('send', 'pageview', ...)</code> die Werte <code>order_id</code> und <code>order_total</code> enthält. Eine optionale <code>email</code> verknüpft die Bestellung nur, wenn der Kontakt bereits existiert. Aus Seitenaufrufen werden nie Kontakte erstellt."
mautic.plugin.ecommerce.install.script_mtcjs_note="Stellen Sie sicher, dass <code>mtc.js</code> auf Ihrer Danke-Seite eingerichtet ist, bevor Sie das folgende Skript verwenden. Die Funktion <code>mt()</code> muss verfügbar sein, zum Beispiel über WP Mautic, eine Mautic-Landingpage oder ein Tracking-Snippet in Ihrem Theme."
mautic.plugin.ecommerce.install.script_wordpress_heading="WordPress und WooCommerce"
mautic.plugin.ecommerce.install.script_wordpress_intro="Wenn Sie WordPress mit WooCommerce nutzen, installieren Sie unser Plugin %link% und das offizielle Plugin WP Mautic."
mautic.plugin.ecommerce.install.script_wordpress_details="Setzen Sie im Tab Allgemein Aktiv auf Ja und aktivieren Sie <strong>Bestellungen aus Seitenaufrufen erfassen</strong>. Setzen Sie im Tab Validierung die erlaubten Bestellquellen auf WooCommerce. Passen Sie den Tab Formatierung nach Bedarf an und aktivieren Sie dann WooCommerce Order Tracking in den Einstellungen von Sync Mautic. Sync Mautic sendet WooCommerce als Bestellquelle und ergänzt auf der Bestellbestätigungsseite automatisch die Bestellfelder, einschließlich der Rechnungs-E-Mail-Adresse, im Standard-Seitenaufruf von WP Mautic. Die Rechnungs-E-Mail-Adresse wird nur zur Verknüpfung mit einem bestehenden Mautic-Kontakt verwendet."
mautic.plugin.ecommerce.install.script_custom_title="Eigenes Skript für die Danke-Seite"
mautic.plugin.ecommerce.install.script_custom_body="Fügen Sie dieses Skript auf Ihrer Bestellbestätigungsseite ein, nachdem das Mautic-Tracking (<code>mtc.js</code>) geladen wurde. Ersetzen Sie die Beispielwerte durch echte Bestelldaten:"
mautic.plugin.ecommerce.install.script_example_note="Verwenden Sie für jede Bestellung eine eindeutige order_id. Geben Sie email an, um die Bestellung mit einem bestehenden Kontakt zu verknüpfen. Aus Seitenaufrufen werden nie Kontakte erstellt. Ohne email braucht der Besucher ein Mautic-Tracking-Cookie (zum Beispiel aus einem Link in einer Mautic-E-Mail oder einer Browsersitzung mit WP Mautic). Bestellungen können auch gespeichert werden, wenn Mautic keinen Seitenaufruf speichert, auch bei DNT oder GPC."
mautic.plugin.ecommerce.install.webhook_heading="Signierter Webhook"
mautic.plugin.ecommerce.install.webhook_intro="Für Shopify, eigene Anwendungen oder jede andere Plattform senden Sie signierte POST-Anfragen von Ihrem Server, sobald eine Bestellung abgeschlossen ist. Legen Sie Ihr Webhook-Secret niemals in Browser-JavaScript ab."
mautic.plugin.ecommerce.install.webhook_security_note="Senden Sie Webhook-Anfragen nur aus Ihrem Server-Backend. Halten Sie Ihr Webhook-Secret aus clientseitigem Code heraus."
