mautic.plugin.ecommerce.gdpr_warning_title="Von diesem Plugin gespeicherte personenbezogene Daten"
mautic.plugin.ecommerce.gdpr_warning="Diese Integration speichert Bestell- und Umsatzdaten, die mit Kontakten verknüpft sind und nach DSGVO und ähnlichen Datenschutzgesetzen personenbezogene Daten sein können. Das Tracking über Seitenaufrufe nutzt die Besuchererkennungs-Cookies von Mautic und setzt kein zusätzliches Cookie. Es kann eine Kontakt-E-Mail-Adresse senden, um einen bestehenden Kontakt zu verknüpfen, und Bestellungen aus diesen Tracking-Anfragen können auch gespeichert werden, wenn Mautic keinen Seitenaufruf speichert, auch wenn der Browser DNT oder GPC sendet. Sie allein sind für alle Datenschutzmaßnahmen verantwortlich, die für Ihre Nutzung dieser Integration erforderlich sind, einschließlich Rechtsgrundlage, Angaben in der Datenschutzerklärung und gegebenenfalls Einwilligung."
