mautic.plugin.ecommerce.install.script_heading="Browser tracking (script injection)"
mautic.plugin.ecommerce.install.script_intro="Enable <strong>Track orders from page hits</strong> on the General tab, then send order data from your thank-you page using Mautic tracking (<code>mtc.js</code>). Orders are recorded when <code>mt('send', 'pageview', ...)</code> includes <code>order_id</code> and <code>order_total</code>. Optional <code>email</code> links the order only if that contact already exists. Contacts are never created from page hits."
mautic.plugin.ecommerce.install.script_mtcjs_note="Make sure <code>mtc.js</code> is set up on your thank-you page before using the script below. The <code>mt()</code> function must be available, for example via WP Mautic, a Mautic landing page, or a tracking snippet added to your theme."
mautic.plugin.ecommerce.install.script_wordpress_heading="WordPress and WooCommerce"
mautic.plugin.ecommerce.install.script_wordpress_intro="If you use WordPress with WooCommerce, install our %link% plugin and the official WP Mautic plugin."
mautic.plugin.ecommerce.install.script_wordpress_details="On the General tab, set Active to Yes and enable <strong>Track orders from page hits</strong>. On the Validation tab, set Allowed order sources to WooCommerce. Configure the Formatting tab as needed, then enable WooCommerce Order Tracking in Sync Mautic settings. Sync Mautic sends WooCommerce as the order source and adds order fields, including billing email, to the standard WP Mautic pageview automatically on the order confirmation page. Billing email is used only to link an existing Mautic contact."
mautic.plugin.ecommerce.install.script_custom_title="Custom thank-you page script"
mautic.plugin.ecommerce.install.script_custom_body="Add this script to your order confirmation page after Mautic tracking (<code>mtc.js</code>) is already loaded. Replace the example order values with real order data:"
mautic.plugin.ecommerce.install.script_example_note="Use a unique order_id for each order. Include email to link the order to an existing contact. Contacts are never created from page hits. If email is omitted, the visitor needs a Mautic tracking cookie (for example from a Mautic email link or WP Mautic browsing session). Orders can still be stored when Mautic does not save a page hit, including DNT or GPC."
mautic.plugin.ecommerce.install.webhook_heading="Signed webhook"
mautic.plugin.ecommerce.install.webhook_intro="For Shopify, custom apps, or any platform, send signed POST requests from your server when an order completes. Never put your webhook secret in browser JavaScript."
mautic.plugin.ecommerce.install.webhook_security_note="Send webhook requests only from your server backend. Keep your webhook secret out of client-side code."
mautic.plugin.ecommerce.install.cta_intro="Need a custom integration built for your store?"
mautic.plugin.ecommerce.install.cta_phone="Call Dog Byte Marketing at %phone%."
