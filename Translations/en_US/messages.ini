mautic.plugin.ecommerce.gdpr_warning_title="Personal data stored by this plugin"
mautic.plugin.ecommerce.gdpr_warning="This integration stores order and revenue data linked to contacts, which may be personal data under GDPR and similar privacy laws. Page-hit tracking uses Mautic visitor identification cookies and does not set an additional cookie. It may send a contact email to link an existing contact, and orders from those tracking requests can be stored even when Mautic does not save a page hit, including when the browser sends DNT or GPC. You are solely responsible for any data protection measures required for your use of this integration, including lawful basis, privacy policy disclosures, and consent where required."
