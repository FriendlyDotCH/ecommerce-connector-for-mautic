mautic.plugin.ecommerce.install.step1_body="Öffnen Sie den Tab Allgemein und setzen Sie Aktiv auf Ja. Öffnen Sie den Tab Webhook und geben Sie ein langes, zufälliges Webhook-Secret ein. Speichern Sie die Einstellungen."
